[project]
name = "jevinf"
version = "0.1.0"
description = "Inference engine for Jev-style decision models: prefix sharing + KV residency"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.121",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "uvicorn>=0.38",
]

[project.scripts]
jevinf = "jevinf.cli:main"

[dependency-groups]
# Conformance testing only: the official SDK validates responses with its own pydantic
# models, so "the official client works" is itself the strictest conformance check.
# Not a runtime dependency.
dev = ["typesafe-sdk>=0.7"]

# Optional, and not installed by a plain `uv sync`: the fused kernel behind the chunked
# gated-delta-rule layers that make up 3 of decider-2b's 4 layers. Without it transformers
# falls back to a reference PyTorch implementation -- correct, but slower, and it warns.
# Linux only, on purpose: the kernels import triton, which torch declares with
# `sys_platform == "linux"` and which publishes manylinux wheels only. Off Linux the marker
# makes the group a no-op instead of a package that installs and then fails at import.
# `causal-conv1d` is deliberately absent: it ships source only and no prebuilt wheel matches
# this project's Python/torch/CUDA triple, so installing it fails on a matching host.
# AGENTS.md records the failure; add it by hand where a published wheel does exist.
decider-kernels = ["flash-linear-attention>=0.5.2; sys_platform == 'linux'"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
